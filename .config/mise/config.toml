[settings]
idiomatic_version_file_enable_tools = []
minimum_release_age = "7d"

[settings.python]
uv_venv_auto = "create|source"

[env]
CLAUDE_BASH_MAINTAIN_PROJECT_WORKING_DIR = "true"

[tools]
ast-grep = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
bun = "latest"
direnv = "latest"
# Pinned: npm's @google/gemini-cli carries junk versions (0.0.88…0.0.899…)
# that defeat mise's "latest" sort. github backend is unsigned (SIGKILL on
# macOS) and brew is deprecated, so pin the official npm backend and bump manually.
gemini-cli = "0.51.0"
hadolint = "latest"
lazydocker = "latest"
lua = "5.1"
node = "lts"
prettier = "latest"
python = ["3.14", "3.13", "3.12", "3.11", "3.10"]
ruby = "3"
ruff = "latest"
shellcheck = "latest"
svgo = "latest"
tree-sitter = "latest"
zizmor = "latest"
"gem:teamocil" = "latest"
"npm:@auth0/auth0-mcp-server" = "0.1.0-beta.12"
"npm:@browsermcp/mcp" = "latest"
"npm:@gsong/ccmcp" = "latest"
"npm:@mariozechner/claude-trace" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:@netlify/mcp" = "latest"
"npm:@perplexity-ai/mcp-server" = "latest"
"npm:@upstash/context7-mcp" = "latest"
"npm:ccstatusline" = "latest"
"npm:ccusage" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"npm:mcp-remote" = "latest"
"npm:repomix" = "latest"
"npm:task-master-ai" = "latest"
"npm:tldr" = "latest"
"pipx:crawl4ai" = "latest"
"pipx:files-to-prompt" = "latest"
"pipx:markitdown" = { version = "latest", extras = "all", uvx_args = "--prerelease=allow" }
"pipx:sqlfluff" = "latest"
"pipx:titlecase" = "latest"
"npm:@playwright/cli" = "latest"
pandoc = "latest"
uv = "latest"
"npm:@azure-devops/mcp" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:agent-browser" = "latest"
"npm:typescript-language-server" = "latest"
"npm:pyright" = "latest"
pnpm = "latest"
"aqua:openai/codex" = "latest"
